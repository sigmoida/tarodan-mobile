# Logout subflow: login yapılmış olmalı. Çıkış Ayarlar ekranının en altında (Profil -> ⚙️).
# Logout sonrası uygulama login ekranına yönlendirir (router.replace /(auth)/login).
appId: ${APP_ID}
---
- runFlow: open-settings.yaml
- scrollUntilVisible:
    element:
      id: "profile-logout-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "profile-logout-button"
- runFlow:
    when:
      visible: "Onayla"
    commands:
      - tapOn: "Onayla"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 10000
# Post-logout state guard: login form gerçekten render olmuş, "Giriş Yap"
# butonu görünür. Aksi takdirde sonraki subflow'lar SKIPPED yerine FAILED
# dönebilir.
- assertVisible: "Giriş Yap"
