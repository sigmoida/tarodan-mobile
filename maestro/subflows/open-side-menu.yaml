# Yan menüyü (hamburger) aç: alt menüden Profil -> üst bardaki hamburger. Hamburger YALNIZ Profil
# sekme kökünde (`app-shell-menu`); Ana Sayfa / Favoriler / Sepet köklerindeki sol düğme kategorilerdir
# (`home-categories-button` / `app-shell-categories` -> /categories).
# Alışveriş / Finans / Koleksiyon / Analiz / Destek / Bilgi satırları ARTIK Profil ekranında değil,
# yan menüde (satır testID'leri değişmedi: profile-orders-link, profile-trades-link, ...).
# Kullanım: runFlow bu dosya -> tapOn id: "profile-orders-link" (alt satırlar için önce
# scrollUntilVisible). Ön koşul: kullanıcı login (misafirde yalnız Yardım + Bilgi satırları var).
appId: ${APP_ID}
---
- tapOn:
    id: "tab-profile"
    optional: true
- extendedWaitUntil:
    visible:
      id: "app-shell-menu"
    timeout: 30000
- tapOn:
    id: "app-shell-menu"
- extendedWaitUntil:
    visible:
      id: "side-menu"
    timeout: 10000
