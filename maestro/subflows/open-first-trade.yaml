# Profil → Takaslarım → ilk takas kartını aç.
# Pre-req: kullanıcı login + en az bir takas seed'li.
appId: ${APP_ID}
---
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "profile-trades-link"
    timeout: 15000
- tapOn:
    id: "profile-trades-link"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: ".*Takas.*|.*takas.*"
    timeout: 30000
