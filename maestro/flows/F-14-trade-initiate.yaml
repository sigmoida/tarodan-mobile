# F-14: Initiate trade → ali@demo.com → tradeAvailable ürün → "Takas" → trade/new.
# Fixture: ali kendi listing'inde takas teklif edemez. Manual.
appId: ${APP_ID}
tags:
  - manual
env:
  EMAIL: ali@demo.com
  PASSWORD: Demo123!
  SEARCH_TERM: Hot Wheels
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible:
        id: "profile-edit-button"
    file: ../subflows/logout.yaml
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000
- tapOn:
    id: "login-email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password-input"
- inputText: ${PASSWORD}
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible: "Ana Sayfa"
    timeout: 30000
- runFlow:
    when:
      visible: "Şimdi Değil"
    commands:
      - tapOn: "Şimdi Değil"
- runFlow: ../subflows/open-search.yaml
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 20000
- tapOn:
    id: "search-input"
- inputText: ${SEARCH_TERM}
- extendedWaitUntil:
    visible:
      text: ".*[0-9],[0-9][0-9] TL.*"
    timeout: 30000
- tapOn:
    text: ".*[0-9],[0-9][0-9] TL.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "product-price"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "product-detail-add-to-cart-button"
    direction: DOWN
    timeout: 30000
- assertVisible: "Sepete Ekle"
# tradeAvailable ürünlerde "Takas Teklifi" butonu var
- scrollUntilVisible:
    element:
      id: "product-detail-trade-button"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "product-detail-trade-button"
    optional: true
# Yasal kimlik eksikse kapı açılır (1.0.6) — çalıştırmada MAESTRO_TEST_TCKN verin.
- runFlow: ../subflows/pass-identity-gate.yaml
- extendedWaitUntil:
    visible:
      text: "Takas|Eşya|teklif"
    timeout: 20000
- assertNotVisible: ".*Network Error.*"
- assertNotVisible: ".*Bir hata oluştu.*"
