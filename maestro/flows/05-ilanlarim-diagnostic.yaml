# İlanlarım ekranı: login → profile → İlanlarım listesinde en az 1 ilan görünür.
# Zeynep'in seed'de 6 ilanı var.
appId: ${APP_ID}
tags:
  - smoke
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible:
        id: "profile-edit-button"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- runFlow: ../subflows/open-side-menu.yaml
- extendedWaitUntil:
    visible:
      id: "side-menu-item-listings"
    timeout: 15000
- tapOn:
    id: "side-menu-item-listings"
- extendedWaitUntil:
    visible:
      text: ".*İlan.*"
    timeout: 15000
- assertNotVisible:
    text: ".*Bir hata oluştu.*"
- assertNotVisible:
    text: ".*Network Error.*"
