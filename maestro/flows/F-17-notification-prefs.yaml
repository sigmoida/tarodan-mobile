# F-17: Notification prefs — toggle + persistence after navigation.
appId: ${APP_ID}
tags:
  - regression
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      text: "Bildirim"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Bildirim Ayarları|Bildirim"
- extendedWaitUntil:
    visible:
      text: "Bildirim"
    timeout: 15000
- assertNotVisible: ".*Network Error.*"
# Tekrar aç-kapa: navigate away & back, error olmamalı.
- back
- tapOn:
    text: "Bildirim Ayarları|Bildirim"
    optional: true
- assertNotVisible: ".*Bir hata oluştu.*"
