# 01-02: Yanlış şifre → login error banner görünür, ana sayfaya geçilmez.
appId: ${APP_ID}
tags:
  - regression
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow: ../subflows/logout.yaml
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000
- tapOn:
    id: "login-email-input"
- inputText: "zeynep@demo.com"
# Giriş iki aşamalı (web gibi): e-posta -> Devam Et -> şifre.
- tapOn:
    id: "login-continue-button"
- extendedWaitUntil:
    visible:
      id: "login-password-input"
    timeout: 15000
- tapOn:
    id: "login-password-input"
- inputText: "yanlis-sifre"
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible:
      id: "login-error-banner"
    timeout: 15000
- assertVisible:
    id: "login-error-banner"
- assertNotVisible:
    id: "home-search-input"
