# E-02: Refund request flow — login → Profil → Siparişlerim → ilk paid order →
# "İade Talep Et" → iade talebi EKRANI (eskiden modal) → varsayılan neden (Vazgeçtim) →
# alt çubuktaki "Talep Oluştur" → detaya geri dönülür, aktif iade banner'ı + başarı toast'ı.
# Not: "Hasarlı geldi" gibi kusur nedenleri kanıt fotoğrafı + 20+ karakter açıklama ister;
# galeri seçimi Maestro'da otomatik değil, bu yüzden akış kanıt istemeyen varsayılan nedenle gider.
#
# Pre-req: Zeynep'in seed'inde en az bir `payment.status = completed`, status != cancelled/refunded
# sipariş bulunmalı. Aksi halde "İade Talep Et" butonu render edilmez ve flow fail eder.
# Backend seed: pnpm db:seed (default seed orders dahil).
appId: ${APP_ID}
tags:
  - manual
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible:
        id: "profile-edit-button"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- runFlow: ../subflows/open-first-order.yaml
# Refund request button
- scrollUntilVisible:
    element:
      id: "refund-request-button"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 30
- tapOn:
    id: "refund-request-button"
- extendedWaitUntil:
    visible:
      id: "refund-request-screen"
    timeout: 10000
- assertVisible: "İade Talebi Oluştur"
- tapOn:
    id: "refund-submit-button"
# Başarıda ekran kapanır, sipariş detayı tazelenir.
- extendedWaitUntil:
    visible:
      id: "refund-active-banner"
    timeout: 15000
- assertNotVisible:
    id: "refund-request-screen"
- assertNotVisible: ".*Network Error.*"
