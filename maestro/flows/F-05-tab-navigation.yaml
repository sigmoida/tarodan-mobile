# F-05: Tab navigation comprehensive — login → her bottom tab (Ana Sayfa, Favoriler, Mesajlar, Profil;
# + ortada İlan Ver). Arama tab değil; üst bar arama alanından açılır (subflows/open-search.yaml).
# Sekmelere dokunma testID ile (tab-home, tab-favorites, tab-sell, tab-messages, tab-profile).
appId: ${APP_ID}
tags:
  - smoke
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
# 1. Ana Sayfa
- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      text: "Ana Sayfa"
    timeout: 15000
- assertNotVisible: ".*Network Error.*"
# 2. Favoriler
- tapOn:
    id: "tab-favorites"
- extendedWaitUntil:
    visible:
      text: "Favorilerim.*"
    timeout: 20000
- assertNotVisible: ".*Network Error.*"
# 2b. Arama: tab değil, üst bardaki arama alanı (tab kökünden)
- tapOn:
    id: "tab-home"
- runFlow: ../subflows/open-search.yaml
- assertVisible:
    id: "search-input"
- assertNotVisible: ".*Network Error.*"
# Arama yığın ekranı: tab çubuğu yok, geri oku ile tab köküne dön
- tapOn:
    text: "Geri"
# 3. Mesajlar
- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible:
      text: "Mesajlar"
    timeout: 15000
- assertNotVisible: ".*Network Error.*"
# 4. Profil
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "zeynep@demo.com"
    timeout: 15000
- assertVisible: "zeynep@demo.com"
- assertNotVisible: ".*Bir hata oluştu.*"
# Geri Ana Sayfa'ya dön (clean state)
- tapOn:
    id: "tab-home"
- assertVisible: "Ana Sayfa"
