# F-24: Manual. Pre-condition: zeynep'in delivered durumda bir order'ı
# (14 gün içinde). Akış: detay → İade Talep Et → iade talebi EKRANI → varsayılan neden
# (kusur nedenleri kanıt fotoğrafı ister, galeri Maestro'da otomatik değil) →
# Talep Oluştur → ekran kapanır → "İade Sürüyor" banner. Sonra DB'de RefundRequest.status →
# 'return_shipment_open' + returnTrackingNumber set. Pull-to-refresh →
# RFD-tracking görünür.
appId: ${APP_ID}
tags:
  - manual
---
- runFlow: ../subflows/open-tarodan.yaml
- runFlow: ../subflows/open-first-order.yaml
- extendedWaitUntil:
    visible:
      id: "refund-request-button"
    timeout: 15000
- tapOn:
    id: "refund-request-button"
- extendedWaitUntil:
    visible:
      id: "refund-request-screen"
    timeout: 10000
- tapOn:
    id: "refund-submit-button"
- extendedWaitUntil:
    visible:
      id: "refund-active-banner"
    timeout: 15000
# Kullanıcı manuel olarak DB update'i yapar (RefundRequest.status='return_shipment_open' + returnTrackingNumber)
# Pull-to-refresh
- swipe:
    start: 50%, 30%
    end: 50%, 80%
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "RFD-"
