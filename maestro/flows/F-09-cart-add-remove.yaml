# F-09: Add to cart → cart screen → remove → empty.
appId: ${APP_ID}
tags:
  - regression
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
  SEARCH_TERM: Hot Wheels
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- tapOn:
    text: "Ara"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 20000
- tapOn:
    id: "search-input"
- inputText: ${SEARCH_TERM}
- extendedWaitUntil:
    visible:
      text: ".*[0-9],[0-9][0-9] TL.*"
    timeout: 30000
- tapOn:
    text: ".*[0-9],[0-9][0-9] TL.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "product-detail-add-to-cart-button"
    timeout: 30000
- tapOn:
    id: "product-detail-add-to-cart-button"
# Toast: "Sepete eklendi" → üst bardaki sepet ikonuyla cart'a git
- extendedWaitUntil:
    visible:
      text: ".*sepet.*|.*Sepete eklendi.*"
    timeout: 15000
- tapOn:
    id: "product-cart-button"
- extendedWaitUntil:
    visible: "Sepetim"
    timeout: 15000
- assertVisible: "Sepetim"
- assertVisible:
    id: "cart-item-row"
- assertVisible:
    id: "cart-checkout-button"
# Sil butonuna tıkla (IconButton — trash-can-outline ikonu)
- tapOn:
    text: "trash-can-outline|Sil|Kaldır|Çıkar"
    optional: true
# Eğer ikon tıklaması başarısızsa cart-item-row üzerindeki ilk delete IconButton
- extendedWaitUntil:
    visible:
      text: "Sepetiniz Boş|empty"
    timeout: 15000
    optional: true
- assertNotVisible: ".*Network Error.*"
