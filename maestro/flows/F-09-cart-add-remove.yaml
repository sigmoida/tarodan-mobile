# F-09: Add to cart → cart screen → remove → empty.
appId: ${APP_ID}
tags:
  - regression
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
  SEARCH_TERM: Hot Wheels
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible:
        id: "profile-edit-button"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- runFlow: ../subflows/open-search.yaml
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 20000
- tapOn:
    id: "search-input"
- inputText: ${SEARCH_TERM}
- extendedWaitUntil:
    visible:
      text: ".*[0-9],[0-9][0-9] TL.*"
    timeout: 30000
- tapOn:
    text: ".*[0-9],[0-9][0-9] TL.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "product-price"
    timeout: 30000
# Sepet düğmesi sabit alt barda (kaydırma gerekmez); ürün zaten sepetteyse "Sepete Git".
- extendedWaitUntil:
    visible:
      id: "product-detail-(add-to-cart|go-to-cart)-button"
    timeout: 30000
- tapOn:
    id: "product-detail-(add-to-cart|go-to-cart)-button"
# Toast: "Sepete eklendi" → deep link ile cart rotasına git (ürün detayında sepet adası yok)
- extendedWaitUntil:
    visible:
      text: ".*sepet.*|.*Sepete eklendi.*"
    timeout: 15000
- openLink: "tarodan://cart"
- extendedWaitUntil:
    visible: "Sepetim"
    timeout: 15000
- assertVisible: "Sepetim"
- assertVisible:
    id: "cart-item-row"
- assertVisible:
    id: "cart-checkout-button"
# Sil butonuna tıkla (IconButton — trash-can-outline ikonu)
- tapOn:
    text: "trash-can-outline|Sil|Kaldır|Çıkar"
    optional: true
# Eğer ikon tıklaması başarısızsa cart-item-row üzerindeki ilk delete IconButton
- extendedWaitUntil:
    visible:
      text: "Sepetiniz Boş|empty"
    timeout: 15000
    optional: true
- assertNotVisible: ".*Network Error.*"
