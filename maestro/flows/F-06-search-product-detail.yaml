# F-06: Search → result → product detail → back nav.
appId: ${APP_ID}
tags:
  - smoke
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
  SEARCH_TERM: Hot Wheels
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible:
        id: "profile-edit-button"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- runFlow: ../subflows/open-search.yaml
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 20000
- tapOn:
    id: "search-input"
- inputText: ${SEARCH_TERM}
- extendedWaitUntil:
    visible:
      text: ".*sonuç bulundu.*|.*[0-9],[0-9][0-9] TL.*"
    timeout: 30000
- assertVisible:
    text: ".*[0-9],[0-9][0-9] TL.*"
# İlk fiyat etiketine tap → product detail
- tapOn:
    text: ".*[0-9],[0-9][0-9] TL.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "product-price"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "product-detail-add-to-cart-button"
    direction: DOWN
    timeout: 30000
- assertVisible: "Sepete Ekle"
- assertVisible:
    id: "product-detail-add-to-cart-button"
- assertNotVisible: ".*Network Error.*"
# Galeri üstündeki yüzen geri adası ile arama sonuçlarına dön (iOS + Android aynı)
- assertVisible:
    id: "product-back-button"
- tapOn:
    id: "product-back-button"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 15000
- assertVisible:
    id: "search-input"
