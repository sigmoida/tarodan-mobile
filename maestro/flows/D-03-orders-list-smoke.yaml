# D-03: Sipariş listesi smoke — login → Yan menü → Siparişlerim → liste açılır.
# Zeynep'in seed'de sipariş geçmişi var; ekran boş olmamalı.
appId: ${APP_ID}
tags:
  - regression
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible:
        id: "profile-edit-button"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- runFlow: ../subflows/open-profile-menu.yaml
- extendedWaitUntil:
    visible:
      id: "profile-orders-link"
    timeout: 15000
- tapOn:
    id: "profile-orders-link"
- waitForAnimationToEnd
- assertNotVisible: ".*Network Error.*"
- assertNotVisible: ".*Bir hata oluştu.*"
