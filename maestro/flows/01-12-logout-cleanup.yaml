# 01-12: Logout cleanup — login → logout → login ekranı (form alanları görünür).
appId: ${APP_ID}
tags:
  - regression
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- runFlow: ../subflows/login-as.yaml
- tapOn:
    id: "tab-profile"
- runFlow: ../subflows/logout.yaml
# Logout sonrası uygulama login ekranına yönlendirir.
- assertVisible:
    id: "login-email-input"
# Giriş iki aşamalı: logout sonrası 1. adım (e-posta + Devam Et) görünür, şifre alanı henüz yok.
- assertVisible:
    id: "login-continue-button"
- assertNotVisible:
    text: "zeynep@demo.com"
