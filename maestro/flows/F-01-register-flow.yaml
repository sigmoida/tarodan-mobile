# F-01: Register form happy path → login screen redirect.
# Backend redirects to /(auth)/login on successful register; verify e-postanız doğrulayın
# UI normalde verify-email ekranında çıkar. Bu flow form gönderimini ve form sonrası
# auth navigasyonunu kapsar.
# Email çakışmasından kaçınmak için timestamp tabanlı email gerekir; manual tag
# kullanıyoruz çünkü her run benzersiz değer istemek için override edilmeli.
appId: com.tarodan.app
tags:
  - manual
env:
  # `Date.now()` (ms) yalnız RAKAM üretir. Kullanıcı adı regex'i
  # `^[a-z0-9](?:[a-z0-9._]*[a-z0-9])?$` tire/iki nokta KABUL ETMEZ, o yüzden
  # e-postadaki "e2e-" deseni kullanıcı adında kullanılamaz. Sonuç ~16 karakter
  # (3-30 sınırının içinde). `maestro.timestamp` Maestro'da tanımlı bir sabit
  # değil (undefined'a çözülüp her koşumda AYNI değeri üretiyordu).
  REG_EMAIL: e2e-${Date.now()}@demo.com
  REG_USERNAME: e2e${Date.now()}
  REG_PASSWORD: Demo123!Demo
  REG_NAME: E2E User
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000
- tapOn:
    text: "Üye Ol|Kayıt Ol|Hesap Oluştur"
- extendedWaitUntil:
    visible:
      id: "register-displayName-input"
    timeout: 15000
# username: RegisterDto'de ZORUNLU — boş bırakılırsa form doğrulamada takılır
# ve gönderim hiç olmaz (aşağıdaki "doğrula/Giriş" beklemesi 30 sn sonra düşer).
- tapOn:
    id: "register-username-input"
- inputText: ${REG_USERNAME}
# Uygunluk sorgusu 400 ms debounce'lu — sonucu bekle.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "register-displayName-input"
- inputText: ${REG_NAME}
- tapOn:
    id: "register-email-input"
- inputText: ${REG_EMAIL}
- tapOn:
    id: "register-password-input"
- inputText: ${REG_PASSWORD}
- tapOn:
    text: "Şifre Tekrar"
- inputText: ${REG_PASSWORD}
- tapOn:
    text: "Kullanım koşullarını"
- tapOn:
    id: "register-submit-button"
# Başarılı: login ekranına yönlendirilir VEYA verify-email gate çıkar.
- extendedWaitUntil:
    visible:
      text: ".*doğrula.*|.*Giriş.*|.*E-posta.*"
    timeout: 30000
- assertNotVisible: ".*Network Error.*"
- assertNotVisible: ".*Kayıt başarısız.*"
