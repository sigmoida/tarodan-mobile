# F-07: Kategori drill-down — Ana sayfada kategori bölümü kalktı (web'de yok); kategoriye
# Ara sekmesindeki öneri panelinden (Kategoriler bölümü) gidilir → filtreli sonuçlar → ürün.
appId: ${APP_ID}
tags:
  - regression
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- runFlow: ../subflows/open-search.yaml
- tapOn:
    id: "search-input"
- inputText: "ar"
# Öneri panelinde Kategoriler bölümünün ilk öğesi.
- extendedWaitUntil:
    visible:
      id: "search-category-suggestion"
    timeout: 30000
- tapOn:
    id: "search-category-suggestion"
    index: 0
# Kategori filtresi uygulandı: sonuçlar (ya da tek boş durum) yüklenir; hata yok.
- extendedWaitUntil:
    visible:
      text: ".*[0-9],[0-9][0-9] TL.*|Henüz ilan yok"
    timeout: 30000
- assertNotVisible: ".*Network Error.*"
# İlk fiyatlı ürüne tıkla.
- tapOn:
    text: ".*[0-9],[0-9][0-9] TL.*"
    index: 0
    optional: true
- extendedWaitUntil:
    visible:
      text: "Hemen Al|Teklif Ver|Açıklama|Henüz ilan yok"
    timeout: 30000
- assertNotVisible: ".*Bir hata oluştu.*"
# Geri nav: ürün → arama
- back
- extendedWaitUntil:
    visible: "Ana Sayfa"
    timeout: 15000
