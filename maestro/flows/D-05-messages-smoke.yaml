# D-05: Mesajlar tab smoke — login → Mesajlar tab → ekran yüklenir.
# Yeni thread + mesaj gönderme akışı iki kullanıcı gerektirir, bu flow sadece
# mesaj listesinin render olduğunu doğrular.
appId: ${APP_ID}
tags:
  - regression
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible:
        id: "profile-edit-button"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- tapOn:
    id: "tab-messages"
- waitForAnimationToEnd
- assertNotVisible: ".*Network Error.*"
- assertNotVisible: ".*Bir hata oluştu.*"
