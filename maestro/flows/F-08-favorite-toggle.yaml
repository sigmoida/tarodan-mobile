# F-08: Favorite → unfavorite from list and detail.
# Search ile ürün bul → kalp ikonu tap → Profil → Favoriler → list'te kalbi tekrar tap.
# Heart icon testID yok, "kalp" /heart label fallback yok; ikona tıklamak için
# "Beğen" / "Favoriye" gibi label dene; aksi halde optional flow.
appId: ${APP_ID}
tags:
  - manual
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
  SEARCH_TERM: Hot Wheels
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- tapOn:
    text: "Ara"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 20000
- tapOn:
    id: "search-input"
- inputText: ${SEARCH_TERM}
- extendedWaitUntil:
    visible:
      text: ".*[0-9],[0-9][0-9] TL.*"
    timeout: 30000
- tapOn:
    text: ".*[0-9],[0-9][0-9] TL.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "product-price"
    timeout: 30000
# Heart ikonu — accessibility label'ı "Favoriye Ekle" veya "Beğen" olabilir.
- tapOn:
    id: "product-favorite-button"
    optional: true
# Profil → Favoriler
- tapOn:
    text: "Profil"
- scrollUntilVisible:
    element:
      text: "Favorilerim|Favori"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    text: "Favorilerim|Favori"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Favoriler|Favori"
    timeout: 15000
- assertNotVisible: ".*Network Error.*"
