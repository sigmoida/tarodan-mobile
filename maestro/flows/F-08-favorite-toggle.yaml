# F-08: Favorite → unfavorite from list and detail.
# Search ile ürün bul → kalp ikonu tap → Favoriler sekmesi → list'te kalbi tekrar tap.
# Heart icon testID yok, "kalp" /heart label fallback yok; ikona tıklamak için
# "Beğen" / "Favoriye" gibi label dene; aksi halde optional flow.
appId: ${APP_ID}
tags:
  - manual
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
  SEARCH_TERM: Hot Wheels
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      visible:
        id: "profile-edit-button"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- runFlow: ../subflows/open-search.yaml
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 20000
- tapOn:
    id: "search-input"
- inputText: ${SEARCH_TERM}
- extendedWaitUntil:
    visible:
      text: ".*[0-9],[0-9][0-9] TL.*"
    timeout: 30000
- tapOn:
    text: ".*[0-9],[0-9][0-9] TL.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "product-price"
    timeout: 30000
# Heart ikonu — accessibility label'ı "Favoriye Ekle" veya "Beğen" olabilir.
- tapOn:
    id: "product-favorite-button"
    optional: true
# Favoriler artık alt menüde sekme (yan menüde değil); ürün detayı yığın ekranı olduğundan sekme
# köküne derin bağlantıyla geçilir.
- openLink: "tarodan://favorites"
- extendedWaitUntil:
    visible:
      text: "Favoriler|Favori"
    timeout: 15000
- assertNotVisible: ".*Network Error.*"
