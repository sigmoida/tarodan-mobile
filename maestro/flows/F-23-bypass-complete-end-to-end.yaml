# F-23: Bypass mode'da uçtan uca: ürün → Sepete Ekle → cart → checkout →
# mesafeli satış onayı → Ödeme Yap → bypass-complete → /payment/success.
#
# NOT (BUG-007 düzeltmesi): App sepet-tabanlı; eski "Hemen Al"/product-detail-buy-button
# yok. Doğru zincir: product-detail-add-to-cart-button → sepet (tarodan://cart) →
# cart-checkout-button → checkout (tek sayfa: onay kutusu → Ödeme Yap).
# Pre-req: PAYMENT_BYPASS=true + zeynep'te kayıtlı teslimat adresi.
appId: ${APP_ID}
tags:
  - smoke
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
# Ara → ilk ürün
- runFlow: ../subflows/open-search.yaml
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 15000
- tapOn:
    id: "search-input"
- inputText: "diecast"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: ".*[0-9],[0-9][0-9] TL.*"
    index: 0
# Ürün detay → Sepete Ekle → sepet (deep link; sepet adası yok)
- extendedWaitUntil:
    visible:
      id: "product-price"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "product-detail-add-to-cart-button"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "product-detail-add-to-cart-button"
- openLink: "tarodan://cart"
# Cart → Satın Al → checkout
- extendedWaitUntil:
    visible:
      id: "cart-checkout-button"
    timeout: 15000
- tapOn:
    id: "cart-checkout-button"
# Checkout tek sayfa (web gibi): adres → ödeme yöntemi → özet + mesafeli satış onayı → Ödeme Yap
- extendedWaitUntil:
    visible:
      id: "checkout-address"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "checkout-distance-sales-checkbox"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "checkout-distance-sales-checkbox"
- tapOn:
    id: "checkout-pay-button"
# Yasal kimlik eksikse kapı açılır (1.0.6) — çalıştırmada MAESTRO_TEST_TCKN verin.
- runFlow: ../subflows/pass-identity-gate.yaml
- extendedWaitUntil:
    visible:
      text: ".*başarı.*|Sipariş.*tamamland.*|Tamamlandı"
    timeout: 30000
# Profil → Siparişlerim → yeni sipariş görünür
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "profile-orders-link"
- assertVisible: "ORD-"
