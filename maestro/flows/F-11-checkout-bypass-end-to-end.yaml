# F-11: Bypass checkout end-to-end → order created.
# Önkoşul: PAYMENT_BYPASS=true apps/api/.env'de + zeynep'in kayıtlı bir adresi olmalı.
appId: ${APP_ID}
tags:
  - manual
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
  SEARCH_TERM: Hot Wheels
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- tapOn:
    text: "Ara"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 20000
- tapOn:
    id: "search-input"
- inputText: ${SEARCH_TERM}
- extendedWaitUntil:
    visible:
      text: ".*[0-9],[0-9][0-9] TL.*"
    timeout: 30000
- tapOn:
    text: ".*[0-9],[0-9][0-9] TL.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "product-detail-add-to-cart-button"
    timeout: 30000
- tapOn:
    id: "product-detail-add-to-cart-button"
- tapOn:
    id: "product-cart-button"
- extendedWaitUntil:
    visible:
      id: "cart-checkout-button"
    timeout: 15000
- tapOn:
    id: "cart-checkout-button"
- extendedWaitUntil:
    visible: "Teslimat Bilgileri"
    timeout: 30000
- tapOn:
    text: "Devam Et.*"
- extendedWaitUntil:
    visible:
      text: ".*Geliştirici modu.*"
    timeout: 30000
- assertVisible:
    text: ".*Geliştirici modu.*"
- tapOn:
    text: ".*Ödeme.*Tamamla.*|.*Ödemeyi.*"
# Yasal kimlik eksikse kapı açılır (1.0.6) — çalıştırmada MAESTRO_TEST_TCKN verin.
- runFlow: ../subflows/pass-identity-gate.yaml
- extendedWaitUntil:
    visible:
      text: ".*Sipariş.*|.*başarı.*|.*tamamland.*"
    timeout: 60000
- assertNotVisible: ".*Network Error.*"
- assertNotVisible: ".*hata oluştu.*"
# Profil → Siparişlerim — yeni sipariş listede
- tapOn:
    text: "Profil"
- scrollUntilVisible:
    element:
      id: "profile-orders-link"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "profile-orders-link"
- extendedWaitUntil:
    visible:
      text: "Siparişlerim"
    timeout: 30000
- assertNotVisible: ".*Network Error.*"
