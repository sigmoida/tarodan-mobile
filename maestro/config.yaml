# Maestro project config - shared env across all flows.
# Override per run: maestro test --env EMAIL=foo@bar.com flows/auth-login.yaml
#
# Flow'larda `appId` sabit DEĞİL: `appId: ${APP_ID}` (flows/ ve subflows/). Değer:
#   - `pnpm maestro:dev ...` (run.sh) otomatik verir: varsayılan com.tarodan.app,
#     EAS `maestro` profili build'i için MAESTRO_TARGET=staging → com.tarodan.app.staging
#   - doğrudan `maestro test` için: --env APP_ID=$(bash app-id.sh <ios|android> staging)
# Seçim tablosu: app-id.sh.
env:
  APP_ID: com.tarodan.app
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
  PREMIUM_EMAIL: ahmet@demo.com
  BUSINESS_EMAIL: ali@demo.com
  # E-01 / E-08 deep-link hedefi. Gerçek bir stockout product UUID'si ile override edin:
  # maestro test --env STOCKOUT_PRODUCT_ID=<uuid> flows/E-01-stockout-page.yaml
  STOCKOUT_PRODUCT_ID: "00000000-0000-0000-0000-000000000000"
