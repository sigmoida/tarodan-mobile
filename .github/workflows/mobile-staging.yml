name: Mobile Staging (CI → fingerprint → OTA or build)

# development'a push → staging TAM OTOMATİK:
#
#   1. ci        CI (lint + tsc + test) — ci.yml `workflow_call` ile. Kırmızıysa
#                hiçbir şey yayınlanmaz.
#   2. plan      Her platform için runtime fingerprint'i hesaplanır
#                (`expo-updates fingerprint:generate`, staging profilinin env'iyle →
#                EXPO_PUBLIC_ENVIRONMENT=preview, yani `.staging` kimlikli config)
#                ve EAS'te bu runtimeVersion için binary durumu okunur
#                (release.sh build-state):
#                  available → OTA   (bitmiş VE TestFlight/Play'e gönderilmiş build)
#                  pending   → OTA   (aynı runtime'ın build'i derleniyor /
#                              gönderiliyor: ikinci build alınmaz; build bitince
#                              bu push'un güncellemesini alır)
#                  none      → build (yeni native binary gerekiyor)
#                Platformlar AYRI değerlendirilir: iOS OTA alırken Android build
#                alabilir (fingerprint platform başına farklıdır).
#   3. ota       eas update --branch staging --platform <yalnız OTA'lık platformlar>
#   4. build-*   iOS:     eas build --profile staging → eas submit --profile staging
#                         (Tarodan (Staging), com.tarodan.app.staging → TestFlight)
#                Android: eas build --profile staging (AAB) → eas submit --profile
#                         staging (ayrı Play uygulaması com.tarodan.app.staging,
#                         internal testing track). vars.ANDROID_RELEASE_ENABLED
#                         == 'true' değilse KAPALI.
#
# Neden regex değil fingerprint: native/JS ayrımının tek doğru cevabı, binary'nin
# runtimeVersion'ıdır (app.json `runtimeVersion.policy: fingerprint`). Eski
# `native_re` dosya listesi hem fazla (eas.json'daki bir submit düzeltmesi) hem
# eksik (yeni bir config plugin dosyası) yakalıyordu. Fingerprint, app.config.js'in
# ÇIKTISINI (çözümlenmiş expoConfig), eas.json'u, config plugin'lerini, native
# autolinking'i ve package.json script'lerini kapsar; app.config.js'te çıktıyı
# değiştirmeyen bir düzenleme (yorum) build tetiklemez. app.json `expo.version`
# da fingerprint'e girer — sürüm artışı her zaman yeni build demektir.
#
# CI bağlantısı neden `needs` (+ reusable ci.yml) ve `workflow_run` değil:
#   - workflow_run her zaman VARSAYILAN dalın workflow dosyasını koşar; aynı
#     model master'da production için kullanılınca production mantığı
#     development'tan gelirdi. needs, commit'in kendi workflow'unu koşar.
#   - Tek koşu grafiği: CI → plan → OTA/build aynı sayfada; github.event (commit
#     mesajı, sha) bozulmadan taşınır; workflow_dispatch da aynı kapıdan geçer.
#   - ci.yml artık push'ta ayrıca tetiklenmez → CI push başına bir kez koşar.
#
# Concurrency (job düzeyinde):
#   - plan: iptalsiz kuyruk (yeni push eski koşunun kararını düşürmez).
#   - ota: matrix, platform + runtime başına iptalsiz kuyruk → daha yeni bir
#     push (başka runtime ya da platform) bekleyen OTA'yı iptal etmez; aynı
#     runtime'ın OTA'ları sırayla çıkar.
#   - build-*: cancel-in-progress YOK → başlamış bir build/submit asla kesilmez.
#     (GitHub semantiği: aynı grupta bekleyen İKİNCİ bir build job'ı, üçüncüsü
#     gelince düşer — yenisi zaten daha yeni kodu taşır.) Build job'ı kilidi
#     aldıktan sonra fingerprint'i yeniden sorgular; arada aynı runtime için bir
#     build başlamış ya da bitmişse build harcamaz, OTA yayınlar.
#
# Elle tetikleme (workflow_dispatch):
#   mode=auto   push ile aynı karar (varsayılan)
#   mode=ota    seçili platform(lar)a OTA zorla
#   mode=build  seçili platform(lar) için build zorla (Android yine değişkene bağlı)
#   mode=apk    YALNIZ ad-hoc Android APK (preview profili, EAS internal
#               distribution) — Play'siz bir müşteriye/testçiye link göndermek için.
#   gh workflow run mobile-staging.yml --ref development -f mode=apk
#   Ref koruması: yalnız refs/heads/development; mode=apk ayrıca
#   vars.STAGING_APK_BRANCHES'teki dallardan (boşlukla ayrılmış glob, ör.
#   "development feature/*"; varsayılan yalnız development). O dalların
#   `staging` environment'ının deployment-branch kuralına da eklenmesi gerekir.
#
# Token: EXPO_TOKEN yalnız GitHub Environment `staging`'de (deployment branch:
# development [+ vars.STAGING_APK_BRANCHES], onay yok). Token isteyen HER job bu
# environment'a bağlı; başka daldan koşan bir workflow token'a ulaşamaz.
# Guard: EXPO_TOKEN yoksa no-op.

on:
  push:
    branches: [development]
    paths-ignore:
      # Kullanıcıya inen JS'i değiştirmeyen yollar: yayın da CI da gereksiz.
      # .github: workflow değişikliği için OTA yayınlamak boş bir update grubu
      # bırakır; workflow testleri PR CI'ında koşar.
      - 'docs/**'
      - '**/*.md'
      - 'maestro/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = fingerprint decides · ota · build · apk (ad-hoc Android APK)'
        required: true
        default: 'auto'
        type: choice
        options: [auto, ota, build, apk]
      platform:
        description: 'Platform(s) for auto/ota/build (apk is always Android)'
        required: true
        default: 'all'
        type: choice
        options: [all, ios, android]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan (fingerprint → OTA or build)
    needs: ci
    runs-on: ubuntu-latest
    # EXPO_TOKEN yalnız `staging` environment'ında (dağıtım yalnız development,
    # onay yok). Repo düzeyinde token YOK — bkz. docs/RELEASE.md "Environment'lar".
    environment: staging
    timeout-minutes: 20
    concurrency:
      group: mobile-staging-plan-${{ github.event_name }}
      # İptalsiz: yeni bir push eski koşunun kararını (ve onun runtime'ına ait
      # OTA'yı) düşürmesin; plan'lar sırayla koşar.
      cancel-in-progress: false
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      ios: ${{ steps.decide.outputs.ios }}
      android: ${{ steps.decide.outputs.android }}
      ios_fp: ${{ steps.decide.outputs.ios_fp }}
      android_fp: ${{ steps.decide.outputs.android_fp }}
      ota_matrix: ${{ steps.decide.outputs.ota_matrix }}
      apk: ${{ steps.decide.outputs.apk }}
      message: ${{ steps.decide.outputs.message }}
      blocked: ${{ steps.decide.outputs.blocked }}
      decided: ${{ steps.decide.outputs.decided }}
    steps:
      - name: Guard — skip if EXPO_TOKEN missing
        id: guard
        env:
          HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN missing — mobile-staging no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
      - name: Only development ships to staging (ad-hoc APK — allowed branches)
        # workflow_dispatch herhangi bir daldan tetiklenebilir; production'daki
        # korumanın aynısı (release.sh guard-ref). APK modu Play'e/OTA'ya
        # dokunmadığı için vars.STAGING_APK_BRANCHES'teki dallardan da çalışır.
        if: steps.guard.outputs.skip != 'true'
        env:
          REF: ${{ github.ref }}
          MODE: ${{ inputs.mode || 'auto' }}
          APK_BRANCHES: ${{ vars.STAGING_APK_BRANCHES || 'development' }}
        run: scripts/ci/release.sh guard-ref staging
      - uses: ./.github/actions/setup-eas
        if: steps.guard.outputs.skip != 'true'
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Decide per platform (fingerprint vs EAS builds)
        id: decide
        if: steps.guard.outputs.skip != 'true'
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          ANDROID_ENABLED: ${{ vars.ANDROID_RELEASE_ENABLED == 'true' }}
          # Kota koruması (ücretsiz plan: iOS ayda 15 build). Elle mode=build atlar.
          MAX_BUILDS_PER_DAY: ${{ vars.STAGING_MAX_BUILDS_PER_DAY || '2' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        # Karar döngüsünün TEK kopyası: scripts/ci/release.sh plan (production ile ortak).
        run: scripts/ci/release.sh plan staging
      - name: Fail if a platform is blocked (other platforms still ship)
        # Plan job'u kırmızı olur ama downstream job'lar `!cancelled()` +
        # `decided == 'true'` ile koştuğu için engellenmeyen platform yayınlanır.
        if: steps.decide.outputs.blocked != ''
        env:
          BLOCKED: ${{ steps.decide.outputs.blocked }}
        run: |
          echo "::error::Engellenen platform(lar): $BLOCKED — ayrıntı yukarıdaki ::error:: satırlarında."
          exit 1

  ota:
    name: OTA → staging (${{ matrix.platform }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.decided == 'true' && needs.plan.outputs.ota_matrix != '[]' && needs.plan.outputs.ota_matrix != '' }}
    strategy:
      fail-fast: false
      # Platform başına bir job: [{platform, fp}] (release.sh plan).
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ota_matrix) }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    # Kuyruk platform + runtime BAŞINA ve iptalsiz: başka runtime'ın (ör. native
    # değişiklik getiren) ya da diğer platformun push'u bu runtime'ın bekleyen
    # (production'da onay bekleyen) OTA'sını İPTAL ETMEZ. Aynı runtime'ın OTA'ları
    # sırayla çıkar (eski yeniyi asla ezmez); GitHub, aynı grupta bekleyen
    # İKİNCİ job'ı üçüncüsü gelince düşürür — o da aynı runtime'ın daha yeni kodu.
    concurrency:
      group: mobile-staging-ota-${{ matrix.platform }}-${{ matrix.fp }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-eas
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA to staging
        # Env eas.json `preview` profilinden yüklenir (release.sh publish-ota) —
        # `eas update` profil env'ini kendisi okumaz. preview ve staging profillerinin
        # EXPO_PUBLIC_* değerleri birebir aynı olmak ZORUNDA (tek OTA dalı ikisini de
        # besliyor; bkz. src/config/__tests__/apiUrl.test.ts).
        env:
          OTA_PLATFORM: ${{ matrix.platform }}
          MSG: ${{ needs.plan.outputs.message }}
        run: scripts/ci/release.sh publish-ota staging "$OTA_PLATFORM" preview "$MSG"

  build-ios:
    name: iOS build → TestFlight (Tarodan Staging)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.decided == 'true' && needs.plan.outputs.ios == 'build' }}
    runs-on: ubuntu-latest
    environment: staging
    # Build ~7 dk ama submit App Store Connect'in işlemesini bekliyor (2026-08-04:
    # 53 dk). 60 dk'da kesilip yanıltıcı "cancelled" bırakıyordu.
    timeout-minutes: 120
    concurrency:
      group: mobile-staging-build-ios
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-eas
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Re-check after acquiring the build lock
        id: recheck
        env:
          FP: ${{ needs.plan.outputs.ios_fp }}
          MODE: ${{ inputs.mode || 'auto' }}
          MAX_BUILDS_PER_DAY: ${{ vars.STAGING_MAX_BUILDS_PER_DAY || '2' }}
        run: scripts/ci/release.sh recheck ios staging
      - name: Publish OTA instead (build already exists for this runtime)
        if: steps.recheck.outputs.action == 'ota'
        env:
          MSG: ${{ needs.plan.outputs.message }}
        run: scripts/ci/release.sh publish-ota staging ios preview "$MSG"
      - name: EAS build + submit (iOS, staging → TestFlight)
        if: steps.recheck.outputs.action == 'build'
        env:
          FP: ${{ needs.plan.outputs.ios_fp }}  # build mesajına ci-fp damgası (döngü koruması)
        run: scripts/ci/release.sh build-submit ios staging staging

  build-android:
    name: Android build → Play internal (Tarodan Staging)
    needs: plan
    # Play hesabı + service account + ilk elle yükleme bitene kadar KAPALI.
    if: ${{ vars.ANDROID_RELEASE_ENABLED == 'true' && !cancelled() && needs.plan.outputs.decided == 'true' && needs.plan.outputs.android == 'build' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 120
    concurrency:
      group: mobile-staging-build-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-eas
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Re-check after acquiring the build lock
        id: recheck
        env:
          FP: ${{ needs.plan.outputs.android_fp }}
          MODE: ${{ inputs.mode || 'auto' }}
          MAX_BUILDS_PER_DAY: ${{ vars.STAGING_MAX_BUILDS_PER_DAY || '2' }}
        run: scripts/ci/release.sh recheck android staging
      - name: Publish OTA instead (build already exists for this runtime)
        if: steps.recheck.outputs.action == 'ota'
        env:
          MSG: ${{ needs.plan.outputs.message }}
        run: scripts/ci/release.sh publish-ota staging android preview "$MSG"
      - name: Verify Android package is com.tarodan.app.staging
        # staging Android build'i ve gönderimi yalnız bu pakete gider. Değilse DUR:
        # eas submit Play uygulamasını AAB'deki paket adından seçer; yanlış paket
        # production Play uygulamasına (com.tarodan.app) gider. Gönderimden önce
        # build'in appIdentifier'ı ayrıca doğrulanır
        # (build-submit'in son argümanı).
        if: steps.recheck.outputs.action == 'build'
        run: scripts/ci/release.sh assert-app-id android staging com.tarodan.app.staging
      - name: EAS build + submit (Android AAB, staging → Play internal testing)
        # submit.staging.android (track: internal) eas.json'da tanımlı olmalı.
        if: steps.recheck.outputs.action == 'build'
        env:
          FP: ${{ needs.plan.outputs.android_fp }}  # build mesajına ci-fp damgası (döngü koruması)
        run: scripts/ci/release.sh build-submit android staging staging com.tarodan.app.staging

  apk:
    name: Ad-hoc Android APK (preview, EAS internal)
    needs: plan
    # Yalnız elle: gh workflow run mobile-staging.yml --ref development -f mode=apk
    # Play'e bağlı değil (EAS internal distribution), bu yüzden
    # ANDROID_RELEASE_ENABLED'a bağlanmadı.
    if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && needs.plan.outputs.decided == 'true' && needs.plan.outputs.apk == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-eas
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build (Android APK, preview → internal distribution)
        id: android_build
        run: scripts/ci/release.sh build-submit android preview -
      - name: Publish the APK install link to the job summary
        env:
          BUILD_ID: ${{ steps.android_build.outputs.build_id }}
        run: |
          set -euo pipefail
          APK_URL="$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' eas-build.json)"
          OWNER="$(jq -r '.expo.owner' app.json)"
          SLUG="$(jq -r '.expo.slug' app.json)"
          INSTALL_PAGE="https://expo.dev/accounts/${OWNER}/projects/${SLUG}/builds/${BUILD_ID}"
          {
            echo "## Staging APK hazır"
            echo
            echo "Müşteriye **kurulum sayfasını** gönder (QR + Install düğmesi var):"
            echo
            echo "  ${INSTALL_PAGE}"
            echo
            echo "Doğrudan APK: ${APK_URL:-yok}"
            echo
            echo "Müşteri tarafı: linki Android telefonun tarayıcısında açar, APK iner,"
            echo "\"bilinmeyen kaynaktan yükleme\" onayı verir, kurulur."
          } >> "$GITHUB_STEP_SUMMARY"
