name: Mobile Staging (OTA + Preview Build)

# main'e push -> staging kanalına YALNIZ OTA. Build ASLA otomatik alınmaz.
#
# iOS build kotası aylık 15. Otomatik build'ler bunu birkaç günde bitiriyordu,
# bu yüzden push yolundan build tamamen kaldırıldı (cron da öyle). OTA ücretsiz
# ve kotadan düşmez, o yüzden otomatik kaldı.
#
#   JS/asset-only -> eas update --branch staging (OTA, otomatik, bedava)
#   native değişti -> hiçbir şey yayınlanmaz + uyarı basılır; build ELLE alınır:
#       gh workflow run mobile-staging.yml --ref main -f mode=build
#         (varsayılan platform=android — müşteriye APK. iOS TestFlight için
#          -f platform=ios, ikisi birden için -f platform=all. Kotalar platform
#          başına ayrı: 15 Android + 15 iOS.)
#
# Native değiştiğinde OTA da yayınlanmaz: runtimeVersion politikası `fingerprint`,
# yani native bağımlılık değişince fingerprint de değişir ve o OTA mevcut hiçbir
# binary'ye ulaşamaz. Yayınlamak yanıltıcı olurdu ("staging güncellendi" görünür,
# aslında kimseye inmez).
#
# Guard: EXPO_TOKEN yoksa no-op.

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!maestro/**'
      # Workflow'un kendisi değiştiğinde OTA yayınlamak anlamsız: kullanıcıya
      # inen JS aynı. Yalnız gürültü üretir ve boş bir update grubu bırakır.
      - '!.github/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to ship to staging'
        required: true
        default: 'build'
        type: choice
        options: [build, ota]
      platform:
        description: 'Which platform to build (mode=build only)'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, all]

concurrency:
  group: mobile-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify change (native -> build, JS -> OTA)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Guard — skip if EXPO_TOKEN missing
        id: guard
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN missing — mobile-staging no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - id: decide
        name: Decide OTA vs full build
        if: steps.guard.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          native_re='^(package\.json|pnpm-lock\.yaml|app\.json|app\.config\.js|eas\.json|google-services\.json)$|^(ios|android|plugins|patches|credentials)/'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Elle tetikleme: build de OTA da serbest — kotayı harcama kararı insanın.
            echo "mode=${DISPATCH_MODE}" >> "$GITHUB_OUTPUT"
          else
            # push: build ASLA otomatik alınmaz (aylık 15 iOS build kotası).
            # Merge commit için ayrı bir dal yok: BASE artık push'un tam tabanı
            # (github.event.before), yani merge'in getirdiği tüm commit'ler zaten
            # diff'e dahil.
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="HEAD~1"
            fi
            changed="$(git diff --name-only "$BASE" HEAD)"
            echo "base=$BASE"
            echo "Changed:"; echo "$changed" | sed 's/^/  /'
            if echo "$changed" | grep -qE "$native_re"; then
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "::warning::Native dosya değişti — OTA bu binary'lere ULAŞAMAZ (fingerprint değişti). Staging'i güncellemek için build hakkı harcaman gerekiyor: gh workflow run mobile-staging.yml --ref main -f mode=build"
            else
              echo "mode=ota" >> "$GITHUB_OUTPUT"
            fi
          fi

  ota:
    name: OTA update -> staging channel
    needs: classify
    if: needs.classify.outputs.skip != 'true' && needs.classify.outputs.mode == 'ota'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA to staging
        # ÖNEMLİ: eas update, eas.json'daki `preview` profilinin `env` bloğunu
        # OKUMAZ — EXPO_PUBLIC_* değerlerini runner ortamından inline eder. Bu
        # değerler burada set edilmezse (a) app.config.js base (prod-id) config
        # üretir → fingerprint preview build'den FARKLI olur → OTA hiçbir staging
        # build'e ULAŞMAZ; (b) EXPO_PUBLIC_API_URL boş kalır → bundle localhost'a
        # bakar. Bu yüzden eas.json `preview` env'i ile birebir aynı set edilir.
        env:
          MSG: ${{ github.event.head_commit.message || 'manual staging OTA' }}
          EXPO_PUBLIC_ENVIRONMENT: preview
          EXPO_PUBLIC_API_URL: https://staging.tarodan.com.tr/api
          EXPO_PUBLIC_WEB_URL: https://staging.tarodan.com.tr
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 243308404313-kdc77bd36flfhv6ujlb5tfd4qjteh94c.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 243308404313-92c5475nff3874maoqes02ajakn81hvh.apps.googleusercontent.com
        run: eas update --branch staging --message "$MSG" --non-interactive

  build:
    name: Staging build -> TestFlight (iOS) / internal APK (Android)
    needs: classify
    if: needs.classify.outputs.skip != 'true' && needs.classify.outputs.mode == 'build'
    runs-on: ubuntu-latest
    # 120, production ile aynı. 60 yetmiyor: build ~7 dk sürüyor ama `eas submit`
    # App Store Connect'in işlemesini bekliyor ve o süre Apple'da, öngörülemiyor.
    # 2026-08-04'te build 14:13'te bitti, submit 53 dk sürdü ve iş 60. dakikada
    # KESİLDİ — sonuç "cancelled" göründü, oysa hiçbir şey başarısız olmamıştı.
    # Yükleme EAS sunucusunda koşuyor; CLI yalnız bekliyor, o yüzden kesilmesi
    # teslimi durdurmuyor ama geriye yanıltıcı bir kırmızı bırakıyor.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS staging build (iOS, store dist -> TestFlight)
        if: inputs.platform == 'ios' || inputs.platform == 'all'
        run: eas build --platform ios --profile staging --non-interactive --wait
      - name: Submit to Tarodan Staging (TestFlight)
        if: inputs.platform == 'ios' || inputs.platform == 'all'
        run: eas submit --platform ios --profile staging --latest --non-interactive

      # Android, iOS'tan SONRA ama onun sonucundan BAĞIMSIZ koşar. Gerekçe kayıtlı
      # bir vaka: 2026-08-04'te `eas submit` App Store Connect'i 53 dk bekledi ve
      # job kesildi, oysa build başarılıydı. Aynı kesinti APK'yı da götürmemeli.
      #
      # `-p all` kullanılamaz: iOS `staging` profilinde (store dist -> TestFlight),
      # Android `preview` profilinde (apk -> internal). `staging` profilinde android
      # bloğu yok; oradan alınsa dağıtamayacağımız bir AAB çıkardı.
      - name: EAS staging build (Android, APK -> internal distribution)
        id: android_build
        if: ${{ !cancelled() && (inputs.platform == 'android' || inputs.platform == 'all') }}
        run: |
          set -euo pipefail
          eas build --platform android --profile preview \
            --non-interactive --wait --json > android-build.json
      - name: Publish the APK install link to the job summary
        # steps.android_build.outcome == 'success' zaten platform koşulunu
        # kapsar (adım atlandıysa outcome boş kalır) — burada inputs.platform'u
        # tekrar etmiyoruz. Amaç: build başarısız olduğunda ya da hiç
        # koşmadığında (ör. artifacts:null'lı hatalı JSON, ya da dosya hiç
        # yazılmadan eas build ölmüşse) "hazır" özeti basmamak.
        if: ${{ !cancelled() && steps.android_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          BUILD_ID="$(jq -r '.[0].id // empty' android-build.json)"
          if [ -z "$BUILD_ID" ]; then
            echo "::error::eas build --json did not return a build id; see the raw output below"
            jq . android-build.json || cat android-build.json
            exit 1
          fi
          APK_URL="$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' android-build.json)"
          OWNER="$(jq -r '.expo.owner' app.json)"
          SLUG="$(jq -r '.expo.slug' app.json)"
          INSTALL_PAGE="https://expo.dev/accounts/${OWNER}/projects/${SLUG}/builds/${BUILD_ID}"
          {
            echo "## Staging APK hazır"
            echo
            echo "Müşteriye **kurulum sayfasını** gönder (QR + Install düğmesi var):"
            echo
            echo "  ${INSTALL_PAGE}"
            echo
            echo "Doğrudan APK: ${APK_URL:-yok}"
            echo
            echo "Müşteri tarafı: linki Android telefonun tarayıcısında açar, APK iner,"
            echo "\"bilinmeyen kaynaktan yükleme\" onayı verir, kurulur."
          } >> "$GITHUB_STEP_SUMMARY"
