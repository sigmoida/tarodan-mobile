name: Mobile Production (CI → fingerprint → approved OTA or store build)

# master'a merge (push) → staging ile AYNI mantık, production kimliğiyle:
#
#   1. ci        CI (ci.yml `workflow_call`).
#   2. plan      Fingerprint `production` profilinin env'iyle
#                (EXPO_PUBLIC_ENVIRONMENT=production → com.tarodan.app) hesaplanır,
#                EAS'teki production build'leriyle karşılaştırılır.
#                  binary var (bitmiş + gönderilmiş) → OTA
#                  build/gönderim sürüyor → bekle (uyarı; OTA da build de yok)
#                  binary yok → native değişti → STORE BUILD. Bu durumda app.json
#                    `expo.version` son production build'inin sürümünden BÜYÜK
#                    olmalı; değilse plan anlaşılır bir hatayla DURUR (bkz.
#                    "VERSION-GATE" adımı). Not: expo.version fingerprint'e girer,
#                    yani sürüm artışı kendi başına da yeni build demektir.
#   3. ota       eas update --branch production — `environment: production`
#                onayına bağlı (GitHub Environment; onaylayan kişi Settings →
#                Environments'ta tanımlı).
#   4. build-ios eas build --profile production → eas submit --profile production
#                → App Store Connect / TestFlight. **App Store incelemesine gönderim
#                (Submit for Review) App Store Connect'te ELLE kalır.**
#      build-android  vars.ANDROID_RELEASE_ENABLED == 'true' iken: production AAB
#                → eas submit --profile production (track: internal). Production
#                track'e yükseltme Play Console'da ELLE (kişisel hesap: önce 12
#                testçi / 14 gün kapalı test şartı).
#
# Concurrency: plan iptalsiz; ota matrix'i platform + runtime başına iptalsiz
# (onay bekleyen bir OTA'yı başka runtime'ın push'u düşürmez); build-* asla
# iptal edilmez.
#
# Elle tetikleme yalnız master ref'inde anlamlıdır (plan başka ref'te durur):
#   gh workflow run mobile-production.yml --ref master -f mode=auto
#   mode=build → sürüm kapısı yalnız UYARI verir (bilinçli insan kararı: ör.
#                aynı sürümün reddedilen build'ini yeniden almak).
#
# Guard: EXPO_TOKEN yoksa no-op.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'maestro/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = fingerprint decides · ota (approval) · build'
        required: true
        default: 'auto'
        type: choice
        options: [auto, ota, build]
      platform:
        description: 'Platform(s); Android also needs vars.ANDROID_RELEASE_ENABLED'
        required: true
        default: 'all'
        type: choice
        options: [all, ios, android]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan (fingerprint → OTA or store build)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: mobile-production-plan-${{ github.event_name }}
      # İptalsiz: yeni bir push eski koşunun kararını (ve onun runtime'ına ait
      # OTA'yı) düşürmesin; plan'lar sırayla koşar.
      cancel-in-progress: false
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      ios: ${{ steps.decide.outputs.ios }}
      android: ${{ steps.decide.outputs.android }}
      ios_fp: ${{ steps.decide.outputs.ios_fp }}
      android_fp: ${{ steps.decide.outputs.android_fp }}
      ota_matrix: ${{ steps.decide.outputs.ota_matrix }}
      message: ${{ steps.decide.outputs.message }}
      blocked: ${{ steps.decide.outputs.blocked }}
      decided: ${{ steps.decide.outputs.decided }}
    steps:
      - name: Guard — skip if EXPO_TOKEN missing
        id: guard
        env:
          HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN missing — mobile-production no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
      - name: Only master ships to production
        if: steps.guard.outputs.skip != 'true'
        env:
          REF: ${{ github.ref }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: scripts/ci/release.sh guard-ref production
      - uses: ./.github/actions/setup-eas
        if: steps.guard.outputs.skip != 'true'
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Decide per platform + VERSION-GATE
        id: decide
        if: steps.guard.outputs.skip != 'true'
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          ANDROID_ENABLED: ${{ vars.ANDROID_RELEASE_ENABLED == 'true' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        # Karar döngüsünün TEK kopyası: scripts/ci/release.sh plan (staging ile ortak).
        run: scripts/ci/release.sh plan production
      - name: Fail if a platform is blocked (other platforms still ship)
        # Plan job'u kırmızı olur ama downstream job'lar `!cancelled()` +
        # `decided == 'true'` ile koştuğu için engellenmeyen platform yayınlanır.
        if: steps.decide.outputs.blocked != ''
        env:
          BLOCKED: ${{ steps.decide.outputs.blocked }}
        run: |
          echo "::error::Engellenen platform(lar): $BLOCKED — ayrıntı yukarıdaki ::error:: satırlarında."
          exit 1

  ota:
    name: OTA → production ${{ matrix.platform }} (requires approval)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.decided == 'true' && needs.plan.outputs.ota_matrix != '[]' && needs.plan.outputs.ota_matrix != '' }}
    strategy:
      fail-fast: false
      # Platform başına bir job: [{platform, fp}] (release.sh plan).
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ota_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Production OTA onaysız ÇIKMAZ: GitHub Environment "production" required
    # reviewers ile korunur (Settings → Environments → production).
    environment: production
    # Kuyruk platform + runtime BAŞINA ve iptalsiz: başka runtime'ın (ör. native
    # değişiklik getiren) ya da diğer platformun push'u bu runtime'ın bekleyen
    # (production'da onay bekleyen) OTA'sını İPTAL ETMEZ. Aynı runtime'ın OTA'ları
    # sırayla çıkar (eski yeniyi asla ezmez); GitHub, aynı grupta bekleyen
    # İKİNCİ job'ı üçüncüsü gelince düşürür — o da aynı runtime'ın daha yeni kodu.
    concurrency:
      group: mobile-production-ota-${{ matrix.platform }}-${{ matrix.fp }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-eas
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA to production
        env:
          OTA_PLATFORM: ${{ matrix.platform }}
          MSG: ${{ needs.plan.outputs.message }}
        run: scripts/ci/release.sh publish-ota production "$OTA_PLATFORM" production "$MSG"

  build-ios:
    name: iOS build + submit (production → App Store Connect)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.decided == 'true' && needs.plan.outputs.ios == 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: mobile-production-build-ios
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-eas
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Re-check after acquiring the build lock
        id: recheck
        env:
          FP: ${{ needs.plan.outputs.ios_fp }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: scripts/ci/release.sh recheck ios production
      - name: EAS build + submit (iOS, production)
        # Submit build'i App Store Connect'e (TestFlight) yükler. İncelemeye
        # gönderim (Submit for Review) App Store Connect'te ELLE yapılır.
        if: steps.recheck.outputs.action == 'build'
        env:
          FP: ${{ needs.plan.outputs.ios_fp }}  # build mesajına ci-fp damgası (döngü koruması)
        run: scripts/ci/release.sh build-submit ios production production

  build-android:
    name: Android build + submit (production → Play internal)
    needs: plan
    # Play Console hesabı + service account + ilk elle yükleme bitene kadar KAPALI.
    if: ${{ vars.ANDROID_RELEASE_ENABLED == 'true' && !cancelled() && needs.plan.outputs.decided == 'true' && needs.plan.outputs.android == 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: mobile-production-build-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-eas
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Re-check after acquiring the build lock
        id: recheck
        env:
          FP: ${{ needs.plan.outputs.android_fp }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: scripts/ci/release.sh recheck android production
      - name: Verify Android package is com.tarodan.app
        # production Android build'i ve gönderimi yalnız bu pakete gider. Değilse DUR:
        # eas submit Play uygulamasını AAB'deki paket adından seçer; yanlış paket
        # staging uygulamasına gider. Gönderimden önce build'in appIdentifier'ı
        # ayrıca doğrulanır
        # (build-submit'in son argümanı).
        if: steps.recheck.outputs.action == 'build'
        run: scripts/ci/release.sh assert-app-id android production com.tarodan.app
      - name: EAS build + submit (Android AAB, production → Play internal track)
        # eas.json submit.production.android.track = internal. Production track'e
        # yükseltme Play Console'da ELLE.
        if: steps.recheck.outputs.action == 'build'
        env:
          FP: ${{ needs.plan.outputs.android_fp }}  # build mesajına ci-fp damgası (döngü koruması)
        run: scripts/ci/release.sh build-submit android production production com.tarodan.app
