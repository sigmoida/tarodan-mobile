name: Secret Scan (gitleaks)

# gitleaks ile commit/diff'te sızmış secret taraması. Monorepo ci.yml secret-scan
# job'ının standalone karşılığı.
#
# - gitleaks-action org repo'larda ücretli lisans ister (GITLEAKS_LICENSE secret).
#   Lisans yoksa action taramadan önce "missing gitleaks license" ile ölür → her
#   PR'da false red. Bu yüzden lisans yokken guard ile no-op yapıyoruz (bizim
#   EXPO_TOKEN deseniyle tutarlı); lisans eklenince otomatik taramaya başlar.
# - Dependabot çalıştırmaları repo secret'larını okuyamaz → gitleaks lisansı
#   göremez; ayrıca bump'ları yalnız manifest/lockfile'a dokunur. O yüzden
#   Dependabot actor'ü atlanır; insan PR'ları normal taranır.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scan:
    name: gitleaks
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Guard — skip if GITLEAKS_LICENSE missing
        id: guard
        run: |
          if [ -z "${{ secrets.GITLEAKS_LICENSE }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GITLEAKS_LICENSE missing — secret-scan no-op (bkz. SECRETS_SETUP.md)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip == 'false'
        with:
          fetch-depth: 0
      - name: gitleaks
        if: steps.guard.outputs.skip == 'false'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
