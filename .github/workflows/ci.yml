name: CI (Mobile)

# PR'larda doğrudan koşar. development/master push'larında AYRI tetiklenmez:
# mobile-staging.yml ve mobile-production.yml bu dosyayı `workflow_call` ile
# çağırıp yayın job'larını `needs: ci` ile ona bağlar. Böylece CI push başına
# bir kez koşar ve hiçbir OTA/build kırmızı bir commit'ten çıkmaz.
on:
  pull_request:
    branches: [development, master]
  workflow_call:

# Çağrıldığında github.* çağıranın bağlamıdır. event_name gruba girer ki elle
# tetiklenen bir staging koşusunun CI'ı, aynı daldaki bir push'unkini (ya da
# tersini) iptal etmesin. Aynı türden yeni bir koşu eskisini iptal eder; eski
# koşunun yayın job'ları da `needs: ci` yüzünden atlanır (eskimiş OTA çıkmaz).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: pnpm test
