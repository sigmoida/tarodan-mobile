name: CI (Mobile)

# PR'larda doğrudan koşar. development/master push'larında AYRI tetiklenmez:
# mobile-staging.yml ve mobile-production.yml bu dosyayı `workflow_call` ile
# çağırıp yayın job'larını `needs: ci` ile ona bağlar. Böylece CI push başına
# bir kez koşar ve hiçbir OTA/build kırmızı bir commit'ten çıkmaz.
on:
  pull_request:
    branches: [development, master]
  workflow_call:

# Çağrıldığında github.* çağıranın bağlamıdır. event_name gruba girer ki elle
# tetiklenen bir staging koşusunun CI'ı, aynı daldaki bir push'unkini (ya da
# tersini) iptal etmesin. Yalnız PR'larda yeni koşu eskisini iptal eder.
# Yayın koşularında (push/dispatch → workflow_call) İPTAL YOK: iptal edilen CI,
# o koşunun yayın job'larını da düşürür; yeni push başka bir runtime'a aitse eski
# runtime'ın OTA'sı hiç çıkmazdı.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Release version matches the commits (PRs into master)
        # Before the merge, on the PR's merge ref (= the future master merge commit):
        # a development -> master PR must carry the version next-version computes
        # (the chore(release) commit, docs/RELEASE.md). This job is the required
        # check, so a PR without it cannot merge. hotfix/* sources are skipped by
        # release.sh; mobile-production.yml repeats the check after the merge.
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        env:
          MODE: auto
          SOURCE_REF: ${{ github.head_ref }}
        run: |
          # The default checkout is shallow and has no tags.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch -q --unshallow origin; fi
          git fetch -q --tags origin
          scripts/ci/release.sh check-release-version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: pnpm test
