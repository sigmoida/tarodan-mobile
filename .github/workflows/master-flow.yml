name: Master Flow (source guard + hotfix back-merge)

# master = production. master is changed only by a PR, and only from two sources:
#   - development  (a release)
#   - hotfix/*     (an urgent fix cut from master; merged back into development)
#
# The "Master source guard" job must be a REQUIRED check for master in the ruleset.
# This workflow gets NO path filter: a skipped required check leaves the PR at
# "Expected - waiting" forever.
#
# Why `pull_request_target` (not pull_request): pull_request reads the workflow file
# from the PR's HEAD, so a PR could edit this file and turn the guard green.
# pull_request_target reads it from the TARGET branch (master); a PR cannot change
# it. The trigger is dangerous (write token + secrets) only if PR code runs; here:
#   - source-guard checks out NOTHING; it reads the event metadata and asks the
#     GitHub API about commit ancestry (`gh api .../compare`, read-only);
#   - every value from the PR (branch name, head sha, repo name) is read through
#     `env:` only, never injected into `run:` with `${{ }}` (no script injection);
#   - hotfix-backmerge runs only for a merged hotfix/* PR from this repo and checks
#     out master, not the PR's code.
# Note: since the file is read from master, the guard takes effect only AFTER this
# file is on master (add the required check to the ruleset then).

on:
  pull_request_target:
    branches: [master]
    # edited: the guard also runs when a PR's base is changed to master later.
    types: [opened, reopened, synchronize, edited, closed]

permissions:
  contents: read

jobs:
  source-guard:
    name: Master source guard
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Two API calls plus one per root commit of the hotfix (usually one).
    timeout-minutes: 10
    # No checkout of PR code (pull_request_target safety; see the file header).
    steps:
      - name: Source branch must be development or a hotfix/* cut from master
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::A PR into master must come from a branch of this repository (source: $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          case "$HEAD_REF" in
            development)
              echo "OK: development -> master" ;;
            hotfix/*)
              # THE HOTFIX RULE (docs point here). A hotfix skips check-release-version
              # and its JS-only merge ships as a production OTA, so none of the commits
              # it adds over master may be on development: those are unreleased
              # development code (a hotfix cut from development, or one that merged
              # development or a branch development already merged). No merge base with
              # development is trusted (a criss-cross history has several); the added
              # commits are checked themselves. Checking their roots (listed commits
              # with no listed parent) is exact: development holding a listed commit
              # holds that commit's root ancestor in the list too. The rule is checked
              # on every PR event (open, push, edit). Fails closed: an API error, an
              # unexpected or incomplete answer, or more than max_commits commits.
              # (A criss-cross between master and the hotfix can list a commit master
              # already has; that refuses a hotfix, never admits one.)
              max_commits=250
              total="$(gh api "repos/$REPO/compare/master...$HEAD_SHA?per_page=1" --jq .total_commits)"
              case "$total" in
                ''|*[!0-9]*)
                  echo "::error::The API gave '$total' as the number of commits $HEAD_REF adds over master; the hotfix cannot be checked."
                  exit 1 ;;
              esac
              if [ "$total" -eq 0 ]; then
                echo "::error::The API lists no commits that $HEAD_REF adds over master; the hotfix cannot be checked."
                exit 1
              fi
              if [ "$total" -gt "$max_commits" ]; then
                echo "::error::$HEAD_REF adds $total commits over master (more than $max_commits); a hotfix is a small fix cut from master. Unreleased development code must go through a development -> master release PR."
                exit 1
              fi
              # One line per added commit: "<sha> <parent sha>...".
              list="$(gh api "repos/$REPO/compare/master...$HEAD_SHA?per_page=100" --paginate --jq '.commits[] | ([.sha] + [.parents[].sha]) | join(" ")')"
              if ! roots="$(printf '%s\n' "$list" | awk -v want="$total" '
                function sha(v) { return v ~ /^[0-9a-f]+$/ && length(v) == 40 }
                BEGIN { n = 0 }
                NF {
                  for (i = 1; i <= NF; i++) if (!sha($i)) bad = $i
                  if ($1 in listed) dup = $1
                  n++; line[n] = $0; listed[$1] = 1
                }
                END {
                  if (bad != "") { print "The API listed '\''" bad "'\'' in the commits of the hotfix; it cannot be checked."; exit 1 }
                  if (dup != "") { print "The API listed " dup " twice in the commits of the hotfix; it cannot be checked."; exit 1 }
                  if (n != want) { print "The API listed " n " of the " want " commits the hotfix adds over master; it cannot be checked."; exit 1 }
                  # Every commit must reach a root through listed parents (no cycle), or
                  # its root ancestor would never be compared.
                  for (k = 1; k <= n; k++) {
                    m = split(line[k], f, " "); c[k] = f[1]; np[k] = m - 1
                    for (i = 2; i <= m; i++) p[k, i - 1] = f[i]
                    root = 1; for (i = 1; i < m; i++) if (p[k, i] in listed) root = 0
                    if (root) { good[f[1]] = 1; roots++ }
                  }
                  do {
                    changed = 0
                    for (k = 1; k <= n; k++) if (!(c[k] in good))
                      for (i = 1; i <= np[k]; i++) if (p[k, i] in good) { good[c[k]] = 1; changed = 1; break }
                  } while (changed)
                  for (k = 1; k <= n; k++) if (!(c[k] in good)) { print "The API listed " c[k] " with a parent cycle in the commits of the hotfix; it cannot be checked."; exit 1 }
                  if (!roots) { print "The API listed no root commit for the hotfix; it cannot be checked."; exit 1 }
                  for (k = 1; k <= n; k++) {
                    root = 1; for (i = 1; i <= np[k]; i++) if (p[k, i] in listed) root = 0
                    if (root) print c[k]
                  }
                }')"; then
                echo "::error::$HEAD_REF: $roots"
                exit 1
              fi
              for sha in $roots; do
                # identical | ahead: development contains the commit.
                status="$(gh api "repos/$REPO/compare/$sha...development?per_page=1" --jq .status)"
                case "$status" in
                  behind|diverged) ;;
                  identical|ahead)
                    echo "::error::$HEAD_REF carries development commits that are not on master ($sha is on development; compare status: $status). A hotfix must be cut from master: git switch -c hotfix/<name> origin/master, then cherry-pick the fix. Unreleased development code must go through a development -> master release PR. A hotfix merged into development before master also trips this check: cut a hotfix branch with a new name from origin/master, cherry-pick the fix commits onto it, open that PR and ask for this one to be closed; the back-merge carries it into development after the master merge."
                    exit 1 ;;
                  *)
                    echo "::error::Could not tell whether development contains $sha (compare status: '$status'); the hotfix cannot be checked."
                    exit 1 ;;
                esac
              done
              echo "OK: $HEAD_REF -> master (cut from master; none of its $total commits over master is on development)" ;;
            *)
              echo "::error::A PR into master must come from 'development' or a 'hotfix/*' branch (source: '$HEAD_REF'). Merge the change into development, or for an urgent fix cut hotfix/<name> from master."
              exit 1 ;;
          esac

  hotfix-backmerge:
    name: Hotfix back-merge PR (master → development)
    # hotfix/* PR'ı master'a merge edildiğinde: master'daki düzeltme development'a
    # geri taşınmazsa bir sonraki development → master sürümü onu geri alır.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'hotfix/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # backmerge/* dalını master'dan oluşturup push etmek için
      pull-requests: write  # gh pr create
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Open back-merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX_REF: ${{ github.event.pull_request.head.ref }}
          HOTFIX_PR: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # PR'ın head'i doğrudan master OLMAZ: GitHub'ın çakışma editörü çözümü
          # head dalına commit'ler — bu master'a yazmak demek olurdu (ruleset
          # reddeder). Bu yüzden master'ın merge anındaki halinden ayrı bir dal açılır;
          # çakışma o dalda çözülür.
          branch="backmerge/${HOTFIX_REF#hotfix/}-${HOTFIX_PR}"

          if git merge-base --is-ancestor "$MERGE_SHA" origin/development; then
            echo "::notice::development zaten bu düzeltmeyi içeriyor — PR gerekmiyor."
            exit 0
          fi
          git push origin "${MERGE_SHA}:refs/heads/${branch}"

          conflict_note="The trial merge was clean."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach origin/development
          if ! git merge --no-commit --no-ff "$MERGE_SHA" >/dev/null 2>&1; then
            conflict_note="**Conflict.** Resolve it on \`${branch}\` (git merge origin/development), then merge."
          fi
          git merge --abort 2>/dev/null || true

          # The PR is opened even with a conflict; a person resolves it.
          # GITHUB_TOKEN may open a PR only if the repo allows it (Settings -> Actions ->
          # General -> "Allow GitHub Actions to create and approve pull requests").
          if ! gh pr create \
            --base development \
            --head "$branch" \
            --title "chore: back-merge ${HOTFIX_REF} (#${HOTFIX_PR}) master -> development" \
            --body "$(printf '%s\n\n%s\n\n%s\n' \
              "Hotfix #${HOTFIX_PR} (\`${HOTFIX_REF}\`) was merged into master; this PR carries the fix back into development." \
              "${conflict_note}" \
              "Note: PRs opened with GITHUB_TOKEN do not trigger workflows. For CI, close and reopen the PR or push a commit to the branch.")"; then
            echo "::error::The back-merge PR was not opened; branch ${branch} is pushed. If GitHub refused PR creation by Actions, enable Settings -> Actions -> General -> 'Allow GitHub Actions to create and approve pull requests', or open it by hand: gh pr create --base development --head ${branch}"
            exit 1
          fi
