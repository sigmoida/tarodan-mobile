name: Mobile Build (iOS Simulator)

# development profili iOS simulator .app (imzasız) — Maestro Cloud girdisi.
#
# YALNIZ ELLE ÇALIŞIR. iOS build kotası aylık 15 ile sınırlı; bu workflow
# eskiden her development push'unda VE her PR'da bir build harcıyordu — tek başına
# kotayı birkaç günde bitiriyordu. Simulator build'i bir "olsa iyi olur", her
# commit'e bir hak vermeye değmez.
#
#   gh workflow run mobile-build.yml --ref development
#
# Guard: EXPO_TOKEN yoksa no-op.

on:
  workflow_dispatch:

jobs:
  build:
    name: EAS Simulator Build (iOS)
    runs-on: ubuntu-latest
    # EXPO_TOKEN yalnız environment'larda (repo düzeyinde yok). Simulator build'i
    # mağazaya gitmez → `staging` (dağıtım yalnız development; başka dalda koşmak
    # için o dalı staging environment'ının deployment-branch kuralına ekle).
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Guard — skip if EXPO_TOKEN missing
        id: guard
        env:
          HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN missing — mobile build no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.guard.outputs.skip == 'false'
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.skip == 'false'
      - uses: expo/expo-github-action@v9
        if: steps.guard.outputs.skip == 'false'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build (development, iOS simulator)
        if: steps.guard.outputs.skip == 'false'
        run: eas build --profile development --platform ios --non-interactive --no-wait
